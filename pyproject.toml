[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aco"
version = "0.1.0"
description = "Agent Capability Observatory: versioned registry and evaluation plan API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "harbor==0.22.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aco = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# fixture task bundles contain non-pytest test_*.py files; never collect them
norecursedirs = ["tests/fixtures"]
